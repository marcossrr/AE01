<!DOCTYPE html>
<html lang="es">

    <meta charset="UTF-8">

          content="width=device-width, task-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">

<body>
<table border="1">
    <tr>
        <td>Título</td>
        <td>Descripción</td>

    <?php foreach ($tasks as $task){ ?>

        <td>
            <a href="/detalle/<?php echo htmlspecialchars($task->getSlug()) ?>">

            </a>
        </td>
        <td><?php echo htmlspecialchars($task->getDescription()) ?></td>
        <td><?php echo $task->getCreatedAt()->format('Y-m-d') ?></td>
        <td><?php echo $task->getDueDate()->format('Y-m-d') ?></td>
    </tr>
    <?php } ?>
