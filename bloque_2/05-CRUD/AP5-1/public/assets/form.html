<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title><?php echo $update ? 'Actualizar' : 'Nuevo' ?> Producto</title>
</head>
<body>

<h1><?php echo $update ? 'Actualizar' : 'Nuevo' ?> Producto</h1>

<nav>
    <a href="/">Inicio</a> |
    <a href="/productos">Lista de Productos</a>
</nav>

<hr>

<form action="<?php echo $update ? '/producto/update/' . $product->getId() : '/producto/create' ?>" method="POST">

    <?php if($update): ?>
    <input type="hidden" name="id" value="<?php echo $product->getId() ?>">
    <?php else: ?>
    <label>ID:</label><br>
    <input type="number" name="id" required><br><br>
    <?php endif; ?>

    <label>Descripción:</label><br>
    <input type="text" name="description"
           value="<?php echo $update ? htmlspecialchars($product->getDescription()) : '' ?>"
           required><br><br>

    <button type="submit" name="submit" value="1">
        <?php echo $update ? 'Actualizar' : 'Crear' ?> Producto
    </button>

    <?php if(!$update): ?>
    <button type="reset">Limpiar</button>
    <?php endif; ?>

</form>

</body>
</html>
